{{- if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if or (in (slice "crypto" "funds" "youtube" "viral") .Section) (in (slice "crypto" "funds" "youtube" "viral") .Type) }}NewsArticle{{ else if eq .Type "tools" }}TechArticle{{ else }}Article{{ end }}",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | plainify | truncate 160 | jsonify }}{{ end }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Organization",
    "name": "NovumWorld Editorial Team",
    "url": "https://novumworld.com/about/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://novumworld.com/images/logo.png"
    }
  },
  "publisher": {
    "@type": "Organization",
    "name": "NovumWorld",
    "url": "https://novumworld.com/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://novumworld.com/images/logo.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{- with .Params.featured_image -}}
  ,"image": {{ . | absURL | jsonify }}
  {{- end -}}
  ,"inLanguage": {{ .Lang | jsonify }}
  ,"wordCount": {{ .WordCount }}
  {{- with .Params.categories -}}
  ,"articleSection": {{ index . 0 | jsonify }}
  {{- end -}}
  {{- with .Params.tags -}}
  ,"keywords": {{ delimit . ", " | jsonify }}
  {{- end -}}
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": {{ .Site.BaseURL | jsonify }}
    }
    {{- if .Section -}}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ .CurrentSection.Title | jsonify }},
      "item": {{ .CurrentSection.Permalink | jsonify }}
    }
    ,{
      "@type": "ListItem",
      "position": 3,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
    {{- else -}}
    ,{
      "@type": "ListItem",
      "position": 2,
      "name": {{ .Title | jsonify }},
      "item": {{ .Permalink | jsonify }}
    }
    {{- end -}}
  ]
}
</script>

{{- else -}}
{{- /* Non-page: basic WebSite and Global Organization schema */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.description }}"
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "NovumWorld",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.BaseURL }}images/logo-tech.jpg",
  "sameAs": [
    "https://twitter.com/novumworld",
    "https://www.linkedin.com/company/novumworld"
  ],
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "editorial",
    "email": "editorial@novumworld.com"
  }
}
</script>
{{- end -}}
