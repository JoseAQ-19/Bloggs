{{- if .IsPage -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "{{ if eq .Type "tools" }}TechArticle{{ else }}Article{{ end }}",
  "headline": {{ .Title | jsonify }},
  "description": {{ with .Description }}{{ . | jsonify }}{{ else }}{{ .Summary | plainify | truncate 160 | jsonify }}{{ end }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify }},
  "author": {
    "@type": "Organization",
    "name": "NovumWorld Editorial Team",
    "url": "https://novumworld.com/about/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://novumworld.com/images/logo.png"
    }
  },
  "publisher": {
    "@type": "Organization",
    "name": "NovumWorld",
    "url": "https://novumworld.com/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://novumworld.com/images/logo.png"
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify }}
  }
  {{- with .Params.featured_image -}}
  ,"image": {{ . | absURL | jsonify }}
  {{- end -}}
  ,"inLanguage": {{ .Lang | jsonify }}
  ,"wordCount": {{ .WordCount }}
  {{- with .Params.categories -}}
  ,"articleSection": {{ index . 0 | jsonify }}
  {{- end -}}
  {{- with .Params.tags -}}
  ,"keywords": {{ delimit . ", " | jsonify }}
  {{- end -}}
}
</script>

{{- else -}}
{{- /* Non-page: basic WebSite schema */ -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ .Site.Title | jsonify }},
  "url": {{ .Site.BaseURL | jsonify }},
  "description": {{ .Site.Params.description | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": "NovumWorld"
  }
}
</script>
{{- end -}}
