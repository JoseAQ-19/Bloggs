{{/* === WPO: AOS loaded with defer to avoid blocking first paint === */}}
<script src="/js/aos.js" defer></script>
<script>
  // AOS Init — fires after DOM is ready (compatible with defer)
  document.addEventListener('DOMContentLoaded', function () {
    AOS.init({
      disable: 'mobile', // SHUT DOWN on mobile to save frames
      once: true,
      offset: 50
    });
  });

  // Reading Progress Bar Logic (passive scroll listener with transform for perf)
  window.addEventListener('scroll', function () {
    var winScroll = document.body.scrollTop || document.documentElement.scrollTop;
    var height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
    var scrolled = (winScroll / height);

    var progressBar = document.getElementById("reading-progress-bar");
    if (progressBar) {
      progressBar.style.transform = 'scaleX(' + scrolled + ')';
    }
  }, { passive: true });
</script>
