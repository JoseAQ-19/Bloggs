<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - NovumWorld</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.8;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }

        header {
            padding: 20px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 30px;
        }

        .home-link {
            text-decoration: none;
            color: #0070f3;
            font-weight: bold;
            font-size: 1.1em;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2.5em;
            color: #111;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .date {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 30px;
            display: block;
        }

        article {
            font-size: 1.15em;
        }

        h2 {
            margin-top: 40px;
            color: #222;
            border-bottom: 2px solid #f4f4f4;
            padding-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
        }

        ul,
        ol {
            margin-bottom: 20px;
            padding-left: 20px;
        }

        li {
            margin-bottom: 10px;
        }

        blockquote {
            border-left: 5px solid #0070f3;
            margin: 30px 0;
            padding-left: 20px;
            color: #555;
            font-style: italic;
            background: #f9f9f9;
            padding: 15px;
        }

        strong {
            color: #000;
        }
    </style>
</head>

<body>
    <header>
        <a href="/" class="home-link">← Volver a NovumWorld</a>
    </header>
    <main>
        <article>
            <h1>{{ .Title }}</h1>
            <span class="date">Publicado el: {{ .Date.Format "02 Jan 2006" }}</span>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
            {{ .Content }}
        </article>
    </main>
</body>

</html>
