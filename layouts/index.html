<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovumWorld - Futuro y Tecnología</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            color: #333;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #f4f4f4;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            margin: 0;
            color: #111;
        }

        .tagline {
            color: #666;
            font-size: 1.2em;
        }

        .article-card {
            padding: 25px;
            margin-bottom: 20px;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
        }

        .article-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-color: #ddd;
        }

        h2 a {
            text-decoration: none;
            color: #0070f3;
            font-size: 1.4em;
        }

        .date {
            color: #888;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }

        .summary {
            margin-top: 10px;
            color: #444;
        }
    </style>
</head>

<body>
    <header>
        <h1>NovumWorld 🚀</h1>
        <p class="tagline">Explorando el futuro de la tecnología, IA y negocios.</p>
    </header>
    <main>
        {{ range .Paginator.Pages }}
        <article class="article-card">
            {{ if .Params.image }}
            <img src="{{ .Params.image }}" alt="{{ .Title }}"
                style="width:100%; height:200px; object-fit:cover; border-radius:4px; margin-bottom:15px;">
            {{ end }}
            <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
            <span class="date">Publicado el: {{ .Date.Format "02/01/2006" }}</span>
            <p class="summary">{{ .Summary | truncate 160 }}</p>
        </article>
        {{ end }}
    </main>
</body>

</html>
