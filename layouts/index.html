<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Site.Title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 1px solid #eee;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #111;
        }

        .post-card {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            transition: box-shadow 0.3s ease;
        }

        .post-card:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .post-title {
            font-size: 1.5rem;
            margin-top: 0;
        }

        .post-title a {
            text-decoration: none;
            color: #0070f3;
        }

        .post-date {
            color: #666;
            font-size: 0.9rem;
        }

        .post-summary {
            color: #555;
        }
    </style>
</head>

<body>
    <header>
        <h1>{{ .Site.Title }}</h1>
        <p>Bienvenido a mi blog sobre tecnología y futuro.</p>
    </header>

    <main>
        {{ range .Paginator.Pages }}
        <article class="post-card">
            <h2 class="post-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
            <div class="post-date">{{ .Date.Format "02 Jan 2006" }}</div>
            <p class="post-summary">{{ .Summary | truncate 150 }}</p>
        </article>
        {{ end }}
    </main>
</body>

</html>
