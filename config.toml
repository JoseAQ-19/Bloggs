baseURL = "https://novumworld.com/"
title = "NovumWorld"
theme = "ananke"
defaultContentLanguage = "en"  # Inglés será la raíz /
enableEmoji = true
enableRobotsTXT = true

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-us"
    contentDir = "content/en"
    weight = 1
    title = "NovumWorld"
    [languages.en.params]
      description = "The Future of Tech & AI"

  [languages.es]
    languageName = "Español"
    languageCode = "es-es"
    contentDir = "content/es"
    weight = 2
    title = "NovumWorld (ES)"
    [languages.es.params]
      description = "El futuro de la tecnología y la IA"

[pagination]
  pagerSize = 6

[params]
  custom_css = ["css/custom.css"]
  description = "The Future of Tech & AI"
  author = "NovumWorld Editorial Team"

