baseURL = "https://novumworld.com/"
title = "NovumWorld"
theme = "ananke"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableEmoji = true
enableRobotsTXT = true

[languages]
  [languages.en]
    languageName = "English"
    languageCode = "en-US"
    contentDir = "content/en"
    weight = 1
    title = "NovumWorld"
    [languages.en.params]
      description = "The Future of Tech & AI"

  [languages.es]
    languageName = "Español"
    languageCode = "es-ES"
    contentDir = "content/es"
    weight = 2
    title = "NovumWorld (ES)"
    [languages.es.params]
      description = "El futuro de la tecnología y la IA"

[pagination]
  pagerSize = 6
paginate = 6

[params]
  custom_css = ["css/custom.css"]
  description = "The Future of Tech & AI"
  author = "NovumWorld Editorial Team"

