name: "Corrector Matrix Workflow"
on:
  workflow_run:
    workflows: ["Writer Matrix Workflow"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrector:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        category: [crypto, fitness, funds, ia, realestate, tools, viral, youtube]
        lang: [es, en]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: QA Editor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS_TOKEN_CEU: ${{ secrets.MODELS_TOKEN_CEU }}
          TOKEN_MODELS: ${{ secrets.TOKEN_MODELS }}
          OPEN_CORRECTOR_API_KEY: ${{ secrets.OPEN_CORRECTOR_API_KEY }}
          CORRECTOR_HF_API_KEY: ${{ secrets.CORRECTOR_HF_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/qa_orchestrator.py --lang ${{ matrix.lang }} --category ${{ matrix.category }}

      - name: Verify Article Integrity
        run: |
          echo "🔍 Verificando artículo ${{ matrix.category }} (${{ matrix.lang }})..."
          if grep -r 'translationKey: "None"' content/${{ matrix.lang }}/${{ matrix.category }}/ 2>/dev/null; then
            echo "❌ CRITICAL: Null TranslationKey"; exit 1
          fi
          echo "✅ Integridad verificada"

      - name: Push Corrected Content
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/${{ matrix.lang }}/${{ matrix.category }}/ data/
          git diff --staged --quiet && echo "No corrections made" && exit 0
          git commit -m "✅ ${{ matrix.category }} (${{ matrix.lang }}) QA Corrected & Approved"
          for i in {1..5}; do
            git pull --rebase origin main --autostash && git push && break || sleep $((i*3))
          done
