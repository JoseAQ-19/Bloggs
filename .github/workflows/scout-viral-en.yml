name: "Scout Viral - English"
on:
  workflow_run:
    workflows: ["Writer Viral - Spanish"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python trend_scout.py --category viral --lang en
      - run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add data/trends_viral_en.json
          git diff --staged --quiet && echo "No trends found" && exit 0
          git commit -m "🔭 Scout Viral (EN): research completed"
          git pull --rebase origin main
          git push
