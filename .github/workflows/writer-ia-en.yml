name: "Writer IA - English"

on:
  workflow_run:
    workflows: ["Scout IA - English"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Writer (EN)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_INDEXING_JSON: ${{ secrets.GOOGLE_INDEXING_JSON }}
        run: python main.py --category ia --lang en

      - name: Verify Content Integrity
        run: |
          if grep -r 'translationKey: "None"' content/; then
            echo "❌ CRITICAL ERROR: Null TranslationKey detected. Aborting."
            exit 1
          fi
          echo "✅ Content integrity verified."

      - name: Push Content
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/en/ia/ data/ static/images/ data/.*
          git diff --staged --quiet && echo "No new content generated" && exit 0
          git commit -m "🤖 IA (EN) Content Generated"
          git pull --rebase origin main
          git push
