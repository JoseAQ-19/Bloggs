name: "Scout Viral - Spanish"
on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python trend_scout.py --category viral --lang es
      - run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add data/trends_viral_es.json
          git commit -m "🔭 Scout Viral (ES): research completed"
          git pull --rebase origin main
          git push
