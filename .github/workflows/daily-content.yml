name: Daily Content Generator

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7,13,19 * * *'

permissions:
  contents: write

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Install NotebookLM MCP Server
        run: |
          pip install notebooklm-mcp-server
          echo "✅ NotebookLM MCP Server instalado"
          which notebooklm-mcp || echo "⚠️ Binary no encontrado en PATH"

      - name: Inject NotebookLM Auth Tokens
        if: ${{ secrets.NOTEBOOKLM_AUTH != '' }}
        env:
          NOTEBOOKLM_AUTH: ${{ secrets.NOTEBOOKLM_AUTH }}
        run: |
          mkdir -p ~/.notebooklm-mcp
          echo "$NOTEBOOKLM_AUTH" > ~/.notebooklm-mcp/auth.json
          echo "🔐 Auth tokens inyectados en ~/.notebooklm-mcp/auth.json"

      - name: Run Content Generator
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "🚀 New Content Generated: $(date)" || echo "No changes to commit"
          git push
