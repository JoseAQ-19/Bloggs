name: Daily Content Generator

on:
  schedule:
    # 7:00, 13:00, 19:00 UTC (Aprox 8AM, 2PM, 8PM España/Europa)
    - cron: '0 7,13,19 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  generate-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para pushear los nuevos posts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright google-genai python-dotenv beautifulsoup4 lxml requests
          playwright install chromium

      - name: Run Content Generator (Sniper Mode)
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # Secreto real → Variable que espera Python
        run: |
          python main.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/posts/ data/ keywords.txt static/images/
          # Commit solo si hay cambios
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-Generated Content (Sniper Mode)" && git push)
