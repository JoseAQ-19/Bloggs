name: "Pipeline - Crypto & Web3 (EN)"

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline-crypto-en
  cancel-in-progress: false

env:
  OMNIROUTE_BASE_URL: "http://localhost:8000/v1"
  OMNIROUTE_API_KEY: "sk-omniroute"
  LLM_MODEL: "auto"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_SCOUT_KEY }}
  OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_SCOUT_API_KEY || secrets.CORRECTOR_HF_API_KEY }}
  EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  TOKEN_MODELS: ${{ secrets.TOKEN_MODELS }}
  MODELS_TOKEN_CEU: ${{ secrets.MODELS_TOKEN_CEU }}
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  autoblog-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python (v3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          npm install -g omniroute
          pip install -r requirements.txt

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Start OmniRoute AI Gateway (Background)
        env:
          PORT: 8000
        run: |
          omniroute --port 8000 &
          echo "Verificando disponibilidad de OmniRoute en http://localhost:8000/v1..."
          for i in {1..25}; do
            if curl -s http://localhost:8000/v1/models > /dev/null 2>&1; then
              echo "OmniRoute está LISTO y respondiendo en el intento $i!"
              break
            fi
            echo "Intento $i/25: Esperando 2 segundos más..."
            sleep 2
          done
          curl --fail http://localhost:8000/v1/models || (echo "ERROR: OmniRoute no inició a tiempo" && exit 1)

      # FASE 1: SCOUT (Caza de tendencias)
      - name: Step 1 - Trend Scout
        run: |
          python scripts/trend_scout.py --section crypto --lang en || python main.py --scout-only --section crypto --lang en

      # FASE 2: WRITER (Redacción con Leaf Bundles, WebP e Inyección GEO)
      - name: Step 2 - Content Writer
        run: |
          python main.py --section crypto --lang en

      # FASE 3: AUDIT & SCHEMA FIX (Validación de calidad y Schema.org)
      - name: Step 3 - Content Quality Audit & Schema Fix
        run: |
          python audit_v2.py --section crypto --lang en --export-json docs/audits/audit_latest.json || true

      # FASE 4: PUERTA DE SEGURIDAD (Gate Hugo Build)
      - name: Step 4 - Verify Hugo Compilation
        run: |
          hugo --gc --minify --renderToMemory --cleanDestinationDir

      # FASE 5: PERSISTENCIA ATÓMICA Y DESPLIEGUE
      - name: Step 5 - Commit, Push and Deploy
        run: |
          git config user.name "NovumBot"
          git config user.email "bot@novumworld.com"
          
          if [ -n "$(git status --porcelain content/ data/ static/ docs/)" ]; then
            echo "Nuevos archivos detectados. Realizando commit atómico..."
            git add content/ data/ static/ docs/
            git commit -m "feat(autoblog): nuevo post en crypto (en) [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
            
            if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
              echo "Disparando despliegue en Vercel..."
              curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL" || true
            fi
          else
            echo "No se generó contenido nuevo en esta pasada. No se realiza commit ni deploy."
          fi
