name: Notificar a Vercel
on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - 'layouts/**'
      - 'themes/**'
      - 'static/**'
      - 'config**'
      - 'hugo.**'
      - 'assets/**'

jobs:
  notify-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not configured; skipping deploy hook."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
