name: "Scout - IA ES 🇪🇸"

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Scout Spanish Trends
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: python trend_scout.py --category ia --lang es

      - name: Push Trends
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add data/
          git diff --staged --quiet && echo "No new trends" && exit 0
          git commit -m "🔭 Scout IA-ES: tendencias España descubiertas"
          git pull --rebase origin main
          git push
