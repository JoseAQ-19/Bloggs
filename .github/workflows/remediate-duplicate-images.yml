name: Remediate Duplicate Images

on:
  workflow_dispatch:
    inputs:
      content_dir:
        description: "Content directory to remediate"
        required: false
        default: "content"
        type: string

permissions:
  contents: write

concurrency:
  group: image-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate duplicate article images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/scripts
        run: python scripts/fix_duplicate_images.py --content-dir "${{ inputs.content_dir }}"

      - name: Commit generated assets
        run: |
          git config user.name "NovumWorld Image Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add content/ static/images/
          if git diff --staged --quiet; then
            echo "No image remediation changes generated."
            exit 0
          fi
          git commit -m "fix(images): remediate duplicate article visuals"
          for attempt in {1..5}; do
            git pull --rebase origin main --autostash && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
