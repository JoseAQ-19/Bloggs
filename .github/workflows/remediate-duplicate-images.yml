name: Remediate Duplicate Images

on:
  workflow_dispatch:
    inputs:
      content_dir:
        description: "Content directory to remediate"
        required: false
        default: "content"
        type: string

permissions:
  contents: write

concurrency:
  group: image-remediation
  cancel-in-progress: false

env:
  OMNIROUTE_BASE_URL: "http://localhost:8000/v1"
  OMNIROUTE_API_KEY: "sk-omniroute"
  LLM_MODEL: "auto"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_SCOUT_KEY }}
  OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
  HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_SCOUT_API_KEY || secrets.CORRECTOR_HF_API_KEY }}
  TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start OmniRoute Gateway (Background)
        env:
          PORT: "8000"
          OMNIROUTE_PORT: "8000"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY || secrets.OPENROUTER_SCOUT_KEY }}
          OPEN_ROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY || secrets.OPENROUTER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY || secrets.HF_SCOUT_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PORT=8000 npx -y omniroute --port 8000 &
          sleep 8
          curl --fail http://localhost:8000/v1/models || exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate duplicate article images
        run: python scripts/fix_duplicate_images.py --content-dir "${{ inputs.content_dir }}"

      - name: Commit generated assets
        run: |
          git config user.name "NovumWorld Image Remediation"
          git config user.email "actions@users.noreply.github.com"
          git add content/ static/images/
          if git diff --staged --quiet; then
            echo "No image remediation changes generated."
            exit 0
          fi
          git commit -m "fix(images): remediate duplicate article visuals [skip ci]"
          for attempt in {1..5}; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep $((attempt * 5))
          done
          exit 1
