name: "Corrector Funds - Spanish"
on:
  workflow_run:
    workflows: ["Writer Funds - Spanish"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa-review:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
      - name: Setup NotebookLM MCP
        env:
          NOTEBOOKLM_AUTH: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          npm install -g notebooklm-mcp-server
          mkdir -p ~/.notebooklm-mcp
          echo "$NOTEBOOKLM_AUTH" > ~/.notebooklm-mcp/auth.json
          chmod 600 ~/.notebooklm-mcp/auth.json
      - name: "QA Editor — Funds (ES)"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS_TOKEN_CEU: ${{ secrets.MODELS_TOKEN_CEU }}
          TOKEN_MODELS: ${{ secrets.TOKEN_MODELS }}
          OPEN_CORRECTOR_API_KEY: ${{ secrets.OPEN_CORRECTOR_API_KEY }}
          CORRECTOR_HF_API_KEY: ${{ secrets.CORRECTOR_HF_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python qa_orchestrator.py --lang es --category funds
      - name: Verify Funds Integrity (ES)
        run: |
          echo "🔍 Verificando Funds (ES)..."
          if grep -r 'translationKey: "None"' content/es/funds/; then
            echo "❌ CRITICAL: Null TranslationKey"; exit 1
          fi
          LATEST=$(ls -t content/es/funds/*.md 2>/dev/null | head -1)
          if [ -n "$LATEST" ]; then
            WORDS=$(wc -w < "$LATEST")
            echo "📊 Artículo: $LATEST ($WORDS palabras)"
            if ! grep -qi "inversión\|financier\|riesgo\|disclaimer\|descargo" "$LATEST"; then
              echo "⚠️ WARNING: Puede faltar disclaimer financiero (obligatorio para AdSense)"
            fi
          fi
          echo "✅ Integridad verificada"
      - name: Push Corrected Content
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/es/funds/
          git diff --staged --quiet && echo "No corrections made" && exit 0
          git commit -m "✅ Funds (ES) QA Corrected & Approved"
          git pull --rebase origin main
          git push
