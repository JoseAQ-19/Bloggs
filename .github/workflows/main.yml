name: Ejecutar Generador de Artículos (LEGACY - DESACTIVADO)
# ⚠️ DESACTIVADO: Usar daily-content.yml (3 veces al día)
on:
  # schedule:
  #   - cron: '0 */8 * * *' # DESACTIVADO - Conflicto con daily-content.yml
  workflow_dispatch: # Solo ejecución manual si se necesita

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          persist-credentials: false 
          fetch-depth: 0 

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: |
          pip install -r requirements.txt

      - name: Ejecutar Script de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python main.py

      - name: Subir cambios
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'josearizaquintero@gmail.com'
          git add .
          git commit -m "🤖 Nuevo artículo generado por IA" || echo "No hay cambios que subir"
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main


