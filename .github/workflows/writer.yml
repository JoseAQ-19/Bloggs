name: "Writer Matrix Workflow"
on:
  workflow_run:
    workflows: ["Scout Matrix Workflow"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        category: [crypto, fitness, funds, ia, realestate, tools, viral, youtube]
        lang: [es, en]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Writer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS_TOKEN_CEU: ${{ secrets.MODELS_TOKEN_CEU }}
          TOKEN_MODELS: ${{ secrets.TOKEN_MODELS }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPEN_ROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          GOOGLE_INDEXING_JSON: ${{ secrets.GOOGLE_INDEXING_JSON }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/core:${{ github.workspace }}/scripts
        run: python main.py --category ${{ matrix.category }} --lang ${{ matrix.lang }}

      - name: Push Generated Article
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/ data/ static/images/
          git diff --staged --quiet && echo "No new content generated" && exit 0
          git commit -m "📝 ${{ matrix.category }} (${{ matrix.lang }}) Draft Generated — pending QA"
          for i in {1..5}; do
            git pull --rebase origin main --autostash && git push && break || sleep $((i*3))
          done

      - name: Trigger Vercel Deploy Hook
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            echo "🚀 Triggering Vercel Deploy Hook..."
            curl -s -o /dev/null -w "HTTP %{http_code}" -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
            echo ""
          else
            echo "⚠️ VERCEL_DEPLOY_HOOK_URL not configured. Skipping."
          fi
