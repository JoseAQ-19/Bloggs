name: Blueprint Engine (Tools)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt playwright google-genai python-dotenv beautifulsoup4 lxml requests notebooklm-mcp-server youtube-transcript-api yt-dlp
          playwright install chromium

      - name: Inject NotebookLM Auth
        env:
          NOTEBOOKLM_AUTH: ${{ secrets.NOTEBOOKLM_AUTH }}
        run: |
          mkdir -p ~/.notebooklm-mcp
          echo "$NOTEBOOKLM_AUTH" > ~/.notebooklm-mcp/auth.json

      - name: Run Tools Generator
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: python main.py --category tools

      - name: Push
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add content/ data/ static/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Blueprint Content Generated" && git push)
