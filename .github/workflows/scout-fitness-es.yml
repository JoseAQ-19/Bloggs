name: "🔭 Scout Fitness - Spanish"

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Category to scout'
        required: true
        default: 'fitness'
        type: string
      lang:
        description: 'Language'
        required: true
        default: 'es'
        type: string
      triggered_by:
        description: 'Who triggered this workflow'
        required: false
        default: 'manual'
        type: string
      timestamp:
        description: 'When this was scheduled'
        required: false
        type: string
  schedule:
    - cron: '0 4 * * *'  # Fallback: mantener cron como respaldo

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Log Dispatch Info
        run: |
          echo "🎯 Workflow triggered by: ${{ inputs.triggered_by }}"
          echo "🕐 Scheduled at: ${{ inputs.timestamp }}"
          echo "📂 Category: ${{ inputs.category || 'fitness' }}"
          echo "🌐 Language: ${{ inputs.lang || 'es' }}"

      - name: Run Scout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELS_TOKEN_CEU: ${{ secrets.MODELS_TOKEN_CEU }}
          TOKEN_MODELS: ${{ secrets.TOKEN_MODELS }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENROUTER_SCOUT_KEY: ${{ secrets.OPENROUTER_SCOUT_KEY }}
          HF_SCOUT_API_KEY: ${{ secrets.HF_SCOUT_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/trend_scout.py --category fitness --lang es

      - name: Commit Results
        run: |
          git config --global user.name "JoseAQ-19"
          git config --global user.email "josearizaquintero@gmail.com"
          git add data/.api_cache.json || true
          git add data/trends_fitness_es.json
          git diff --staged --quiet && echo "No trends found" && exit 0
          git commit -m "🔭 Scout Fitness (ES): research completed"
          git pull --rebase origin main --autostash
          git push

      - name: Notify Scheduler - Success
        if: success()
        run: |
          python scripts/scheduler_callback.py \
            --category fitness \
            --lang es \
            --status success \
            --run-id ${{ github.run_id }} \
            --message "Scout completed successfully"

      - name: Notify Scheduler - Failure
        if: failure()
        run: |
          python scripts/scheduler_callback.py \
            --category fitness \
            --lang es \
            --status failure \
            --run-id ${{ github.run_id }} \
            --message "Scout failed - check logs"
