name: "Daily Self-Improvement Loop (Autonomous QA & Optimization)"

on:
  schedule:
    - cron: '17 3 * * *'  # Todos los días a las 03:17 UTC
  workflow_dispatch:      # Ejecución manual bajo demanda

concurrency:
  group: daily-loop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize-and-heal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          npm install -g omniroute
          pip install -r requirements.txt
          pip install graphifyy pytest

      - name: Start OmniRoute Gateway (Background)
        env:
          PORT: 8000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          omniroute --port 8000 &
          echo "Esperando a OmniRoute..."
          for i in {1..25}; do
            if curl -s http://localhost:8000/v1/models > /dev/null 2>&1; then
              echo "OmniRoute listo en el intento $i"
              break
            fi
            sleep 2
          done
          curl --fail http://localhost:8000/v1/models || exit 1

      - name: Run Daily Self-Improvement Optimizer
        env:
          OMNIROUTE_BASE_URL: "http://localhost:8000/v1"
          OMNIROUTE_API_KEY: "sk-omniroute"
          LLM_MODEL: "auto"
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          python core/daily_optimizer.py

      - name: Commit and Push Optimized Content
        run: |
          git config user.name "NovumOptimizer"
          git config user.email "optimizer@novumworld.com"
          git add .
          git commit -m "chore(auto-heal): optimización continua de calidad SEO/GEO y enlaces [skip ci]" || exit 0
          git pull --rebase --autostash origin main
          git push origin main

      - name: Trigger Vercel Deploy Hook (If changes pushed)
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          fi
